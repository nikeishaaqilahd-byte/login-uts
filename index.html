<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | MICE 25</title>
  <meta name="description" content="Halaman masuk akun MICE 25.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#signin-form">Lewati ke formulir</a>

  <main class="auth">

    <!-- Kolom kiri: artwork branding -->
    <section class="auth__art" aria-label="Artwork MICE 25">
      <img class="auth__art-img" src="img/background.jpg" alt="Ilustrasi cat air seorang pemuda dengan bunga matahari kuning">
      <p class="auth__art-caption">Satu akun untuk semua agenda MICE 25.</p>
    </section>

    <!-- Kolom kanan: formulir login -->
    <section class="auth__panel" aria-labelledby="signin-title">
      <div class="auth__box">

        <div class="auth__logo">
          <img src="img/logomice.jpeg" alt="Logo MICE 25">
        </div>

        <h1 id="signin-title" class="auth__title">Welcome back</h1>

        <button type="button" class="btn btn--sso">
          <svg class="btn__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/>
            <path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.7l4 3.1C6.3 7 8.9 4.8 12 4.8z"/>
          </svg>
          Sign in with Google
        </button>

        <div class="divider" role="separator" aria-label="atau">
          <span>or</span>
        </div>

        <form id="signin-form" class="form" action="#" method="post">
          <div class="field">
            <label class="field__label" for="email">Email or username</label>
            <input class="field__input" type="text" id="email" name="email"
                   placeholder="Enter email or username" autocomplete="username" required>
          </div>

          <div class="field">
            <div class="field__row">
              <label class="field__label" for="password">Password</label>
              <a class="link" href="#">Forgot Password?</a>
            </div>
            <div class="field__control">
              <input class="field__input field__input--icon" type="password" id="password" name="password"
                     placeholder="Enter your password" autocomplete="current-password" required>
              <button type="button" class="field__toggle" id="toggle-password"
                      aria-label="Show password" aria-controls="password" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="check">
            <input class="check__input" type="checkbox" id="remember" name="remember">
            <label class="check__label" for="remember">Remember Me</label>
          </div>

          <button type="submit" class="btn btn--primary">Sign In</button>
        </form>

        <p class="note">By continuing, you agree to our <a class="link" href="#">Terms</a> and <a class="link" href="#">Privacy Policy</a>.</p>
        <p class="note">Don't have an account? <a class="link" href="#">Sign up</a></p>

      </div>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
